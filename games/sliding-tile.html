<!--
  GRAVITY SHIFT — Sliding Tile Puzzle (15-Puzzle variant)
  =========================================================
  Instructions:
    - Click any tile adjacent to the empty space to slide it into place.
    - Arrange the numbers 1–15 in order, left-to-right, top-to-bottom.
    - The empty space should end up in the bottom-right corner.
    - Choose difficulty: 3×3 (8-puzzle) or 4×4 (15-puzzle) or 5×5.
    - Click "New Game" to shuffle and start over.
    - Your move count and time are tracked at the top.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Shift — Sliding Tile Puzzle</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0f0f1a;
    color: #e0e0f0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 30px 20px;
  }

  h1 {
    font-size: 2rem;
    letter-spacing: 0.15em;
    color: #a0c4ff;
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 0.85rem;
    color: #5566aa;
    margin-bottom: 24px;
    letter-spacing: 0.05em;
  }

  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .controls label {
    font-size: 0.9rem;
    color: #8899cc;
  }

  select {
    background: #1a1a2e;
    color: #a0c4ff;
    border: 1px solid #334477;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.9rem;
    cursor: pointer;
    outline: none;
  }

  button {
    background: #1e3a5f;
    color: #a0c4ff;
    border: 1px solid #2a5080;
    border-radius: 8px;
    padding: 8px 20px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    letter-spacing: 0.05em;
  }

  button:hover { background: #274e7a; transform: translateY(-1px); }
  button:active { transform: translateY(0); }

  .stats {
    display: flex;
    gap: 32px;
    margin-bottom: 20px;
  }

  .stat { text-align: center; }

  .stat-value {
    font-size: 1.6rem;
    font-weight: 700;
    color: #a0c4ff;
    font-variant-numeric: tabular-nums;
  }

  .stat-label {
    font-size: 0.75rem;
    color: #445577;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  #board-container {
    position: relative;
    margin-bottom: 20px;
  }

  #board {
    display: grid;
    gap: 4px;
    background: #151528;
    border: 2px solid #223355;
    border-radius: 10px;
    padding: 8px;
    box-shadow: 0 0 30px rgba(50, 80, 160, 0.3);
  }

  .tile {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    transition: transform 0.12s cubic-bezier(.25,.8,.25,1), box-shadow 0.12s;
    background: linear-gradient(135deg, #1e3a6e, #162a50);
    border: 1px solid #2a4a80;
    color: #c8d8ff;
  }

  .tile:hover:not(.empty) {
    transform: scale(1.04);
    box-shadow: 0 0 12px rgba(100, 150, 255, 0.4);
    z-index: 1;
    position: relative;
  }

  .tile:active:not(.empty) { transform: scale(0.97); }

  .tile.empty {
    background: #0f0f1a;
    border: 1px dashed #1a2a40;
    cursor: default;
  }

  .tile.correct {
    background: linear-gradient(135deg, #1a4a2e, #123520);
    border-color: #2a7a40;
    color: #80ffaa;
  }

  #win-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(10,10,26,0.88);
    border-radius: 10px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 10;
  }

  #win-overlay.show { display: flex; }

  #win-overlay h2 {
    font-size: 1.8rem;
    color: #80ffaa;
    letter-spacing: 0.1em;
  }

  #win-overlay p { color: #8899cc; font-size: 0.95rem; }

  #win-overlay button {
    margin-top: 8px;
    background: #1a4a2e;
    border-color: #2a7a40;
    color: #80ffaa;
  }

  .instructions {
    max-width: 360px;
    text-align: center;
    font-size: 0.8rem;
    color: #445577;
    line-height: 1.6;
  }
</style>
</head>
<body>

<h1>GRAVITY SHIFT</h1>
<p class="subtitle">Sliding Tile Puzzle</p>

<div class="controls">
  <label for="size-select">Grid:</label>
  <select id="size-select">
    <option value="3">3 × 3 (easy)</option>
    <option value="4" selected>4 × 4 (classic)</option>
    <option value="5">5 × 5 (hard)</option>
  </select>
  <button id="new-game-btn">New Game</button>
</div>

<div class="stats">
  <div class="stat">
    <div class="stat-value" id="moves-display">0</div>
    <div class="stat-label">Moves</div>
  </div>
  <div class="stat">
    <div class="stat-value" id="time-display">0:00</div>
    <div class="stat-label">Time</div>
  </div>
  <div class="stat">
    <div class="stat-value" id="best-display">—</div>
    <div class="stat-label">Best</div>
  </div>
</div>

<div id="board-container">
  <div id="board"></div>
  <div id="win-overlay">
    <h2>✓ Solved!</h2>
    <p id="win-stats"></p>
    <button id="win-new-btn">Play Again</button>
  </div>
</div>

<p class="instructions">
  Click a tile next to the blank space to slide it.<br>
  Arrange 1 to N in order — blank in the bottom-right.
</p>

<script>
  const board = document.getElementById('board');
  const winOverlay = document.getElementById('win-overlay');
  const movesDisplay = document.getElementById('moves-display');
  const timeDisplay = document.getElementById('time-display');
  const bestDisplay = document.getElementById('best-display');
  const winStats = document.getElementById('win-stats');
  const sizeSelect = document.getElementById('size-select');

  let size, tiles, emptyIdx, moves, startTime, timerInterval, won;
  let bestMoves = {};

  function isSolvable(arr, n) {
    let inv = 0;
    const flat = arr.filter(x => x !== 0);
    for (let i = 0; i < flat.length - 1; i++)
      for (let j = i + 1; j < flat.length; j++)
        if (flat[i] > flat[j]) inv++;
    if (n % 2 === 1) return inv % 2 === 0;
    const row = Math.floor(arr.indexOf(0) / n);
    const rowFromBottom = n - row;
    return (rowFromBottom % 2 === 0) ? (inv % 2 === 1) : (inv % 2 === 0);
  }

  function shuffle(arr, n) {
    do {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    } while (!isSolvable(arr, n) || isSolved(arr, n));
    return arr;
  }

  function isSolved(arr, n) {
    for (let i = 0; i < arr.length - 1; i++)
      if (arr[i] !== i + 1) return false;
    return arr[arr.length - 1] === 0;
  }

  function newGame() {
    clearInterval(timerInterval);
    won = false;
    size = parseInt(sizeSelect.value);
    moves = 0;
    startTime = null;
    movesDisplay.textContent = '0';
    timeDisplay.textContent = '0:00';
    winOverlay.classList.remove('show');

    const n = size * size;
    tiles = Array.from({length: n}, (_, i) => i === n - 1 ? 0 : i + 1);
    shuffle(tiles, size);
    emptyIdx = tiles.indexOf(0);

    const tileSize = size === 5 ? 72 : size === 4 ? 90 : 120;
    board.style.gridTemplateColumns = `repeat(${size}, ${tileSize}px)`;

    renderBoard(tileSize);
    updateBestDisplay();
  }

  function renderBoard(tileSize) {
    board.innerHTML = '';
    const ts = tileSize || (size === 5 ? 72 : size === 4 ? 90 : 120);
    tiles.forEach((val, idx) => {
      const tile = document.createElement('div');
      tile.className = 'tile' + (val === 0 ? ' empty' : '');
      tile.style.width = ts + 'px';
      tile.style.height = ts + 'px';
      tile.style.fontSize = size === 5 ? '1.2rem' : size === 4 ? '1.5rem' : '2rem';
      if (val !== 0) {
        tile.textContent = val;
        if (val === idx + 1) tile.classList.add('correct');
        tile.addEventListener('click', () => handleClick(idx));
      }
      board.appendChild(tile);
    });
  }

  function handleClick(idx) {
    if (won) return;
    const row = Math.floor(idx / size);
    const col = idx % size;
    const eRow = Math.floor(emptyIdx / size);
    const eCol = emptyIdx % size;
    const adjacent = (row === eRow && Math.abs(col - eCol) === 1) ||
                     (col === eCol && Math.abs(row - eRow) === 1);
    if (!adjacent) return;

    if (startTime === null) {
      startTime = Date.now();
      timerInterval = setInterval(updateTimer, 500);
    }

    [tiles[idx], tiles[emptyIdx]] = [tiles[emptyIdx], tiles[idx]];
    emptyIdx = idx;
    moves++;
    movesDisplay.textContent = moves;

    const ts = size === 5 ? 72 : size === 4 ? 90 : 120;
    renderBoard(ts);

    if (isSolved(tiles, size)) {
      clearInterval(timerInterval);
      won = true;
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const key = 'best_' + size;
      if (!bestMoves[key] || moves < bestMoves[key]) bestMoves[key] = moves;
      updateBestDisplay();
      setTimeout(() => {
        winStats.textContent = moves + ' moves · ' + formatTime(elapsed);
        winOverlay.classList.add('show');
      }, 300);
    }
  }

  function updateTimer() {
    if (startTime === null) return;
    timeDisplay.textContent = formatTime(Math.floor((Date.now() - startTime) / 1000));
  }

  function formatTime(s) {
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function updateBestDisplay() {
    const key = 'best_' + size;
    bestDisplay.textContent = bestMoves[key] != null ? bestMoves[key] : '—';
  }

  document.getElementById('new-game-btn').addEventListener('click', newGame);
  document.getElementById('win-new-btn').addEventListener('click', newGame);
  sizeSelect.addEventListener('change', newGame);

  newGame();
</script>
</body>
</html>
