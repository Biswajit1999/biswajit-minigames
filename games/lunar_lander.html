<!DOCTYPE html>
<!--
  Lunar Lander  —  2026-06-18
  A physics-based landing game. Pilot the lander down to a flat green pad.
  Controls:  ↑ / W or Space = main thruster   |   ← → or A D = rotate
  Land softly (low speed, near-vertical, on a pad) before fuel runs out.
  Press R to restart after a crash or landing. Open this file in any browser.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunar Lander</title>
<style>
  html,body{margin:0;height:100%;background:#05070f;color:#cfe3ff;
    font-family:"Courier New",monospace;overflow:hidden;}
  #wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100%;gap:10px;}
  canvas{background:#02030a;border:1px solid #1d2c4a;border-radius:6px;
    box-shadow:0 0 40px rgba(40,90,160,.25);}
  #hint{font-size:13px;color:#5f7aa6;letter-spacing:.5px;}
  b{color:#9fd0ff;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="800" height="560"></canvas>
  <div id="hint"><b>↑/Space</b> thrust &nbsp; <b>← →</b> rotate &nbsp; <b>R</b> restart &nbsp; — land slow &amp; level on a green pad</div>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const G = 0.020;            // gravity
const THRUST = 0.055;       // main engine power
const ROT = 0.045;          // rotation speed
const SAFE_V = 0.9;         // max safe landing speed
const SAFE_A = 0.35;        // max safe tilt (radians)

let keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyR') reset();
  if (['ArrowUp','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => keys[e.code] = false);

let ship, terrain, pads, state, msg, score, level;

function makeTerrain(level){
  // jagged ground with one or two flat landing pads
  const pts = [];
  let y = H - 80 - Math.random()*40;
  const step = 40;
  for (let x = 0; x <= W; x += step){
    pts.push({x, y});
    y += (Math.random()-0.5) * 70;
    y = Math.max(H*0.45, Math.min(H-30, y));
  }
  // carve flat pads
  const padList = [];
  const padCount = level >= 3 ? 1 : 2;
  const usable = pts.length - 4;
  const chosen = new Set();
  while (chosen.size < padCount){
    chosen.add(2 + Math.floor(Math.random()*(usable-2)));
  }
  chosen.forEach(i => {
    const flatY = pts[i].y;
    pts[i].y = flatY; pts[i+1] = pts[i+1] || {x:pts[i].x+step, y:flatY};
    pts[i+1].y = flatY;
    padList.push({x1: pts[i].x, x2: pts[i+1].x, y: flatY,
      bonus: Math.max(1, 4 - Math.round((pts[i+1].x-pts[i].x)/step) ) });
  });
  return {pts, pads: padList};
}

function groundY(x){
  for (let i=0;i<terrain.pts.length-1;i++){
    const a=terrain.pts[i], b=terrain.pts[i+1];
    if (x>=a.x && x<=b.x){
      const t=(x-a.x)/(b.x-a.x);
      return a.y + (b.y-a.y)*t;
    }
  }
  return H;
}

function reset(){
  level = level || 1;
  const t = makeTerrain(level);
  terrain = {pts: t.pts};
  pads = t.pads;
  ship = {x: 120 + Math.random()*120, y: 60, vx: 0.6+Math.random()*0.6, vy: 0,
          a: 0, fuel: 100, thrust:false};
  state = 'play';
  msg = '';
}
score = 0; level = 1;
reset();

function update(){
  if (state !== 'play') return;
  if (keys['ArrowLeft']||keys['KeyA']) ship.a -= ROT;
  if (keys['ArrowRight']||keys['KeyD']) ship.a += ROT;
  ship.thrust = (keys['ArrowUp']||keys['KeyW']||keys['Space']) && ship.fuel>0;
  ship.vy += G;
  if (ship.thrust){
    ship.vx += Math.sin(ship.a)*THRUST;
    ship.vy -= Math.cos(ship.a)*THRUST;
    ship.fuel = Math.max(0, ship.fuel - 0.35);
  }
  ship.x += ship.vx; ship.y += ship.vy;
  if (ship.x<8) {ship.x=8; ship.vx*=-0.4;}
  if (ship.x>W-8){ship.x=W-8; ship.vx*=-0.4;}

  const gy = groundY(ship.x);
  if (ship.y >= gy - 10){
    ship.y = gy - 10;
    const speed = Math.hypot(ship.vx, ship.vy);
    const onPad = pads.find(p => ship.x>=p.x1 && ship.x<=p.x2 && Math.abs(gy-p.y)<2);
    const level_ok = Math.abs(((ship.a+Math.PI)%(2*Math.PI))-Math.PI) < SAFE_A;
    if (onPad && speed < SAFE_V && level_ok){
      state='landed';
      const pts = Math.round((SAFE_V-speed)*100) + Math.round(ship.fuel) + onPad.bonus*40;
      score += pts;
      msg = `TOUCHDOWN  +${pts}   (press R for next site)`;
      level++;
    } else {
      state='crash';
      msg = onPad ? (speed>=SAFE_V?'Too fast — crashed':'Too tilted — crashed')
                  : 'Missed the pad — crashed';
    }
  }
}

function drawShip(){
  ctx.save();
  ctx.translate(ship.x, ship.y);
  ctx.rotate(ship.a);
  // body
  ctx.fillStyle = '#d8e6ff';
  ctx.beginPath();
  ctx.moveTo(0,-12); ctx.lineTo(8,6); ctx.lineTo(-8,6); ctx.closePath();
  ctx.fill();
  // legs
  ctx.strokeStyle='#7fa8e0'; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(-6,5); ctx.lineTo(-10,12); ctx.moveTo(6,5); ctx.lineTo(10,12);
  ctx.stroke();
  // flame
  if (ship.thrust){
    ctx.fillStyle = Math.random()>0.5?'#ffb347':'#ff7733';
    ctx.beginPath();
    ctx.moveTo(-4,6); ctx.lineTo(4,6); ctx.lineTo(0,16+Math.random()*8); ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // stars
  ctx.fillStyle='#16223d';
  for(let i=0;i<60;i++){
    const sx=(i*137)%W, sy=(i*89)%(H*0.6);
    ctx.fillRect(sx,sy,1.4,1.4);
  }
  // terrain
  ctx.beginPath();
  ctx.moveTo(0,H);
  terrain.pts.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.lineTo(W,H); ctx.closePath();
  ctx.fillStyle='#0c1a2c'; ctx.fill();
  ctx.strokeStyle='#3b5b86'; ctx.lineWidth=1.5;
  ctx.beginPath();
  terrain.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
  ctx.stroke();
  // pads
  pads.forEach(p=>{
    ctx.strokeStyle='#3cff8e'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(p.x1,p.y); ctx.lineTo(p.x2,p.y); ctx.stroke();
    ctx.fillStyle='#3cff8e'; ctx.font='10px monospace';
    ctx.fillText('x'+p.bonus, (p.x1+p.x2)/2-6, p.y-6);
  });

  drawShip();

  // HUD
  const speed=Math.hypot(ship.vx,ship.vy);
  ctx.font='14px "Courier New",monospace';
  ctx.fillStyle = speed<SAFE_V?'#7fffb0':'#ff8080';
  ctx.fillText('SPD '+speed.toFixed(2), 14, 22);
  ctx.fillStyle = ship.fuel>20?'#9fd0ff':'#ffcc55';
  ctx.fillText('FUEL '+Math.round(ship.fuel), 14, 42);
  ctx.fillStyle='#9fd0ff';
  ctx.fillText('SCORE '+score, 14, 62);
  ctx.fillText('SITE '+level, W-90, 22);

  if (state!=='play'){
    ctx.fillStyle='rgba(2,3,10,.55)';
    ctx.fillRect(0,H/2-44,W,88);
    ctx.fillStyle = state==='landed'?'#3cff8e':'#ff6b6b';
    ctx.font='26px "Courier New",monospace';
    ctx.textAlign='center';
    ctx.fillText(state==='landed'?'SAFE LANDING':'CRASH', W/2, H/2-6);
    ctx.fillStyle='#cfe3ff'; ctx.font='15px "Courier New",monospace';
    ctx.fillText(msg, W/2, H/2+24);
    ctx.textAlign='left';
  }
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
